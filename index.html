<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Editable Word UI Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Chemical PDF Converter</h1>
        <p class="subtitle">Triggers GitHub Background Execution Layer Securely</p>

        <div class="api-box">
            <label for="ghToken">GitHub Personal Access Token (PAT):</label>
            <input type="password" id="ghToken" placeholder="github_pat_...">
            <span class="hint">Requires 'Actions: Write' permissions on this repository.</span>
        </div>

        <div class="drop-zone" id="dropZone">
            <p>Drag & Drop your Chemical PDF here</p>
            <input type="file" id="fileInput" accept=".pdf" hidden>
            <button class="btn-select" id="selectBtn">Browse</button>
            <div id="fileNameDisplay" class="file-name"></div>
        </div>

        <button class="btn-convert" id="convertBtn" disabled>Trigger Repository Pipeline</button>

        <div class="status-box" id="statusBox" style="display: none;">
            <p id="statusText">Awaiting dispatch...</p>
        </div>
    </div>

    <script>
        const selectBtn = document.getElementById('selectBtn');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const convertBtn = document.getElementById('convertBtn');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const tokenInput = document.getElementById('ghToken');

        let selectedFile = null;

        // Configuration mapping properties 
        const REPO_OWNER = "YOUR_GITHUB_USERNAME"; // <-- REPLACE WITH YOUR GITHUB USERNAME
        const REPO_NAME = "YOUR_REPO_NAME";       // <-- REPLACE WITH YOUR REPOSITORY NAME

        if(localStorage.getItem('gh_pat')) tokenInput.value = localStorage.getItem('gh_pat');

        selectBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if(e.target.files[0]) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = selectedFile.name;
                convertBtn.disabled = false;
            }
        });

        convertBtn.addEventListener('click', async () => {
            const pat = tokenInput.value.trim();
            if(!pat) return alert("Please supply a GitHub Personal Access Token.");
            localStorage.setItem('gh_pat', pat);

            statusBox.style.display = "block";
            statusText.textContent = "Encoding payload streams...";

            const reader = new FileReader();
            reader.readAsDataURL(selectedFile);
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                statusText.textContent = "Dispatched! Pushing payload layer to GitHub Actions...";

                try {
                    // Send to GitHub's native endpoints which fully support Browser CORS requests
                    const response = await fetch(`https://github.com{REPO_OWNER}/${REPO_NAME}/dispatches`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${pat}`,
                            'Accept': 'application/vnd.github+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            event_type: "client_web_upload",
                            client_payload: {
                                filename: selectedFile.name,
                                filedata: base64Data
                            }
                        })
                    });

                    if (response.ok) {
                        statusText.textContent = "Pipeline Triggered! Check your GitHub Actions tab. The converted .docx file will be written to your output/ folder within 1 minute.";
                    } else {
                        const errLog = await response.text();
                        statusText.textContent = `Dispatch failed: ${errLog}`;
                    }
                } catch (err) {
                    statusText.textContent = `Connection error: ${err.message}`;
                }
            };
        });
    </script>
</body>
</html>
