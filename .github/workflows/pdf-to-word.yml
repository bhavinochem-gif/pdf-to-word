name: PDF to Editable Word Automation

on:
  push:
    paths:
      - 'input/**.pdf'
  workflow_dispatch: # Allows you to run this manually from the GitHub Actions tab

jobs:
  convert-document:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping npm install."
          fi

      - name: Run Conversion Script
        env:
          # Ensure you add this key to your GitHub Repository Secrets
          CONVERTIO_API_KEY: ${{ secrets.CONVERTIO_API_KEY }}
        run: node scripts/convert.js

      - name: Commit and Push Editable Word Document
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Stage all generated .docx files in the output directory
          git add output/*.docx
          
          # Check if there are changes to commit so the pipeline doesn't error out
          if git diff --staged --quiet; then
            echo "No new Word files to commit."
          else
            git commit -m "Automated: Processed PDF to editable Word layout"
            git push
          fi
