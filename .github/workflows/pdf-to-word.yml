name: PDF to Editable Word Automation

on:
  push:
    paths:
      - 'input/**.pdf'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  convert-document:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Run Conversion Script
        env:
          # Get a free secret key from convertapi.com and save it in your GitHub Repository Secrets
          CONVERTAPI_SECRET: ${{ secrets.CONVERTAPI_SECRET }}
        run: node scripts/convert.js

      - name: Commit and Push Editable Word Document
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.docx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated: Extracted editable Word file with vector schemas" && git push)
